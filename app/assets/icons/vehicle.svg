<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Outer circle -->
  <circle cx="32" cy="32" r="29" fill="#7A9EC4" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Inner ring -->
  <circle cx="32" cy="32" r="19" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- 3 spokes at 270°, 30°, 150° (Y shape pointing up) -->
  <line x1="32" y1="32" x2="32" y2="13" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="32" y1="32" x2="48.5" y2="41.5" stroke="#1a1a2e" stroke-width="2"/>
  <line x1="32" y1="32" x2="15.5" y2="41.5" stroke="#1a1a2e" stroke-width="2"/>
  <!-- Hub -->
  <circle cx="32" cy="32" r="5.5" fill="#1a1a2e"/>
  <!-- Spoke end caps (inside ring) -->
  <circle cx="32" cy="14" r="2.5" fill="#1a1a2e"/>
  <circle cx="48" cy="41" r="2.5" fill="#1a1a2e"/>
  <circle cx="16" cy="41" r="2.5" fill="#1a1a2e"/>
</svg>
