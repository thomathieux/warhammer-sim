<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Rounded square container -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="#9E7A9E" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- 8 rays radiating from center -->
  <line x1="32" y1="10" x2="32" y2="23" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="41" x2="32" y2="54" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="23" y2="32" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="32" x2="54" y2="32" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="17" y1="17" x2="26" y2="26" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="38" y1="38" x2="47" y2="47" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="47" y1="17" x2="38" y2="26" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="38" x2="17" y2="47" stroke="#1a1a2e" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center circle -->
  <circle cx="32" cy="32" r="8" fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <circle cx="32" cy="32" r="3" fill="#1a1a2e"/>
</svg>
