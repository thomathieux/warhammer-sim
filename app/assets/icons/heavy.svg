<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Hexagon outer (pointy-top, R=28) -->
  <polygon points="32,4 56.2,18 56.2,46 32,60 7.8,46 7.8,18"
           fill="#7A9E7E" stroke="#1a1a2e" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- Hexagon inner (R=14) -->
  <polygon points="32,18 44.1,25 44.1,39 32,46 19.9,39 19.9,25"
           fill="none" stroke="#1a1a2e" stroke-width="1.5"/>
  <!-- 3 axes creating cube illusion -->
  <line x1="32" y1="18" x2="32" y2="46" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="44.1" y1="25" x2="19.9" y2="39" stroke="#1a1a2e" stroke-width="1"/>
  <line x1="19.9" y1="25" x2="44.1" y2="39" stroke="#1a1a2e" stroke-width="1"/>
  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#1a1a2e"/>
</svg>
