<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icon Preview — Warhammer Sim</title>
<style>
  body { background: #F5F0E8; font-family: Georgia, serif; padding: 40px; margin: 0; }
  h1 { color: #1a1a2e; font-size: 1rem; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 32px; }
  .section { margin-bottom: 48px; }
  .section h2 { color: #1a1a2e; font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase;
                border-bottom: 1px solid #1a1a2e; padding-bottom: 6px; margin-bottom: 20px; }
  .row { display: flex; gap: 28px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .icon-cell { text-align: center; }
  .icon-label { font-size: 0.65rem; color: #555; margin-top: 6px; letter-spacing: 0.1em; text-transform: uppercase; }
  .dark { background: #1a1a2e; padding: 28px; border-radius: 10px; }
  .dark h2 { color: #718096; border-color: #2d3748; }
  .dark .icon-label { color: #718096; }
  .sizes { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 4px; }
</style>
</head>
<body>
<h1>Field Manual · Icon System v1</h1>

<!-- UNIT ICONS LIGHT -->
<div class="section">
  <h2>Unités — fond clair</h2>
  <div class="row">
    <div class="icon-cell">
      <div class="sizes">
        <img src="infantry.svg" width="64" height="64">
        <img src="infantry.svg" width="32" height="32">
        <img src="infantry.svg" width="16" height="16">
      </div>
      <div class="icon-label">Infantry</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="heavy.svg" width="64" height="64">
        <img src="heavy.svg" width="32" height="32">
        <img src="heavy.svg" width="16" height="16">
      </div>
      <div class="icon-label">Heavy</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="vehicle.svg" width="64" height="64">
        <img src="vehicle.svg" width="32" height="32">
        <img src="vehicle.svg" width="16" height="16">
      </div>
      <div class="icon-label">Vehicle</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="creature.svg" width="64" height="64">
        <img src="creature.svg" width="32" height="32">
        <img src="creature.svg" width="16" height="16">
      </div>
      <div class="icon-label">Creature</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="commander.svg" width="64" height="64">
        <img src="commander.svg" width="32" height="32">
        <img src="commander.svg" width="16" height="16">
      </div>
      <div class="icon-label">Commander</div>
    </div>
  </div>
</div>

<!-- WEAPON ICONS LIGHT -->
<div class="section">
  <h2>Armes — fond clair</h2>
  <div class="row">
    <div class="icon-cell">
      <div class="sizes">
        <img src="bolter.svg" width="64" height="64">
        <img src="bolter.svg" width="32" height="32">
        <img src="bolter.svg" width="16" height="16">
      </div>
      <div class="icon-label">Bolter</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="blade.svg" width="64" height="64">
        <img src="blade.svg" width="32" height="32">
        <img src="blade.svg" width="16" height="16">
      </div>
      <div class="icon-label">Blade</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="flame.svg" width="64" height="64">
        <img src="flame.svg" width="32" height="32">
        <img src="flame.svg" width="16" height="16">
      </div>
      <div class="icon-label">Flame</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="cannon.svg" width="64" height="64">
        <img src="cannon.svg" width="32" height="32">
        <img src="cannon.svg" width="16" height="16">
      </div>
      <div class="icon-label">Cannon</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="plasma.svg" width="64" height="64">
        <img src="plasma.svg" width="32" height="32">
        <img src="plasma.svg" width="16" height="16">
      </div>
      <div class="icon-label">Plasma</div>
    </div>
    <div class="icon-cell">
      <div class="sizes">
        <img src="blast.svg" width="64" height="64">
        <img src="blast.svg" width="32" height="32">
        <img src="blast.svg" width="16" height="16">
      </div>
      <div class="icon-label">Blast</div>
    </div>
  </div>
</div>

<!-- DARK BACKGROUND -->
<div class="section dark">
  <h2>Unités + Armes — fond sombre</h2>
  <div class="row">
    <div class="icon-cell"><img src="infantry.svg" width="48"><div class="icon-label">Infantry</div></div>
    <div class="icon-cell"><img src="heavy.svg" width="48"><div class="icon-label">Heavy</div></div>
    <div class="icon-cell"><img src="vehicle.svg" width="48"><div class="icon-label">Vehicle</div></div>
    <div class="icon-cell"><img src="creature.svg" width="48"><div class="icon-label">Creature</div></div>
    <div class="icon-cell"><img src="commander.svg" width="48"><div class="icon-label">Commander</div></div>
  </div>
  <div class="row" style="margin-top:16px">
    <div class="icon-cell"><img src="bolter.svg" width="48"><div class="icon-label">Bolter</div></div>
    <div class="icon-cell"><img src="blade.svg" width="48"><div class="icon-label">Blade</div></div>
    <div class="icon-cell"><img src="flame.svg" width="48"><div class="icon-label">Flame</div></div>
    <div class="icon-cell"><img src="cannon.svg" width="48"><div class="icon-label">Cannon</div></div>
    <div class="icon-cell"><img src="plasma.svg" width="48"><div class="icon-label">Plasma</div></div>
    <div class="icon-cell"><img src="blast.svg" width="48"><div class="icon-label">Blast</div></div>
  </div>
</div>

</body>
</html>
